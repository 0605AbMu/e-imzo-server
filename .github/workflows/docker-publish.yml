name: Publish Docker Image to GHCR

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: eimzo-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag asset in assets directory
        id: asset_check
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "Processing tag release: ${TAG} (target version: ${VERSION})"
            
            # Search for zip in assets/ matching version
            MATCH=$(find assets -maxdepth 1 -type f -name "*${VERSION}*.zip" | head -n 1)
            
            if [ -z "$MATCH" ]; then
              echo "::error title=Asset Not Found::CI failed: No asset archive found in 'assets/' for release tag '${TAG}' (version '${VERSION}')!"
              echo "Current files in assets/:"
              ls -la assets/
              exit 1
            fi
            
            ASSET_FILE=$(basename "$MATCH")
            echo "Successfully found asset for tag ${TAG}: ${ASSET_FILE}"
            echo "ASSET_FILE=${ASSET_FILE}" >> $GITHUB_ENV
          else
            # For manual workflow_dispatch without tag, find any available zip
            MATCH=$(find assets -maxdepth 1 -type f -name "e-imzo-server-*.zip" | head -n 1)
            if [ -z "$MATCH" ]; then
              echo "::error title=No Assets::CI failed: No asset zip files found in 'assets/'!"
              exit 1
            fi
            ASSET_FILE=$(basename "$MATCH")
            echo "ASSET_FILE=${ASSET_FILE}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Semantic Versioning)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            # SemVer tag formats: v2.2.1 -> 2.2.1, 2.2, 2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Branch name as tag on pushes to branches
            type=ref,event=branch
            # PR prefix tag
            type=ref,event=pr
            # Short commit SHA tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Maximize build caching with GitHub Actions Cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ASSET_ZIP=${{ env.ASSET_FILE }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).created }}
